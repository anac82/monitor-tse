name: Monitor TSE

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 Brasília = 12:00 UTC
  workflow_dispatch:

jobs:
  monitorar:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout monitor-tse
        uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas requests

      - name: Rodar monitor
        env:
          AGREGADOR_TOKEN: ${{ secrets.AGREGADOR_TOKEN }}
        id: monitor
        run: |
          python scripts/monitor.py
          echo "tem_novas=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Salvar resultados no monitor-tse
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ relatorio_*.md alerta.txt
          git diff --cached --quiet || git commit -m "monitor: snapshot $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: Abrir Issue com novas pesquisas
        if: steps.monitor.outputs.tem_novas == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const hoje = new Date().toISOString().slice(0, 10);
            const path = `data/novas_${hoje}.json`;

            if (!fs.existsSync(path)) { console.log('JSON não encontrado.'); return; }
            const dados = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (dados.total === 0) { console.log('Nenhuma pesquisa nova.'); return; }

            let body = `## 🆕 ${dados.total} nova(s) pesquisa(s) presidencial(is) registrada(s) no TSE\n\n`;
            body += `**Data:** ${dados.data}\n\n`;

            for (const p of dados.novas) {
              body += `### ${p.instituto}\n`;
              body += `| Campo | Valor |\n|---|---|\n`;
              body += `| Protocolo | \`${p.protocolo}\` |\n`;
              body += `| Registro TSE | ${p.tse_registro} |\n`;
              body += `| Campo | ${p.campo_inicio} → ${p.campo_fim} |\n`;
              body += `| Divulgação | ${p.divulgacao} |\n`;
              const n = p.amostra;
              body += `| Amostra | ${n ? n.toLocaleString('pt-BR') : '—'} entrevistados |\n`;
              const custo = p.custo_reais ? `R$ ${p.custo_reais.toLocaleString('pt-BR', {minimumFractionDigits:0})}` : 'não informado';
              body += `| Custo | ${custo} |\n`;
              body += `| Metodologia | ${p.metodologia} |\n`;
              body += `| Status | \`${p.status}\` |\n`;
              body += `| Usar no agregador | ${p.usa_no_agregador ? '✅ sim' : '⚠️ verificar manualmente'} |\n\n`;
            }

            body += `---\n*Gerado automaticamente pelo monitor TSE. Atualize \`data/pesquisas_manuais.csv\` no agregador para incluir os resultados.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[TSE] ${dados.total} nova(s) pesquisa(s) — ${dados.data}`,
              body,
              labels: ['pesquisa-nova'],
            });

      - name: Atualizar pesquisas_pendentes.md no agregador
        if: steps.monitor.outputs.tem_novas == '1'
        env:
          AGREGADOR_TOKEN: ${{ secrets.AGREGADOR_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, base64, urllib.request, urllib.parse

          hoje = __import__('datetime').date.today().isoformat()
          token = os.environ["AGREGADOR_TOKEN"]
          owner = "anac82"
          repo  = "agregador-pesquisas"
          path  = "data/pesquisas_pendentes.md"

          # Ler JSON de novas pesquisas
          with open(f"data/novas_{hoje}.json") as f:
              dados = json.load(f)

          if dados["total"] == 0:
              print("Nenhuma pesquisa nova, pulando.")
              exit(0)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          base_url = f"https://api.github.com/repos/{owner}/{repo}/contents/{path}"

          # ── Buscar arquivo atual (para obter SHA) ──────────────────────────
          sha = None
          conteudo_atual = ""
          try:
              req = urllib.request.Request(base_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  arq = json.loads(resp.read())
                  sha = arq["sha"]
                  conteudo_atual = base64.b64decode(arq["content"]).decode("utf-8")
          except Exception:
              pass  # arquivo não existe ainda — será criado

          # ── Montar novas linhas ────────────────────────────────────────────
          novas_linhas = []
          for p in dados["novas"]:
              if not p.get("usa_no_agregador"):
                  continue  # só adiciona aprovadas
              custo = f"R$ {p['custo_reais']:,.0f}".replace(",",".") if p.get("custo_reais") else "—"
              novas_linhas.append(
                  f"| {p['instituto']} "
                  f"| `{p['protocolo']}` "
                  f"| {p['campo_inicio']} → {p['campo_fim']} "
                  f"| {p['divulgacao']} "
                  f"| {p['amostra']:,} ".replace(",",".") if p.get('amostra') else f"| — "
                  f"| {custo} "
                  f"| {p['metodologia']} "
                  f"| ⏳ pendente |"
              )

          if not novas_linhas:
              print("Nenhuma pesquisa aprovada para adicionar à lista de pendentes.")
              exit(0)

          # ── Montar conteúdo completo ───────────────────────────────────────
          cabecalho = (
              "# Pesquisas pendentes de coleta\n\n"
              "> Atualizado automaticamente pelo monitor-tse. "
              "Preencha os resultados em `data/pesquisas_manuais.csv` "
              "e faça push para remover da lista.\n\n"
              "| Instituto | Protocolo | Campo | Divulgação | Amostra | Custo | Metodologia | Status |\n"
              "|-----------|-----------|-------|------------|---------|-------|-------------|--------|\n"
          )

          # Preservar linhas pendentes antigas (que ainda não foram preenchidas)
          linhas_antigas = []
          if conteudo_atual:
              for linha in conteudo_atual.splitlines():
                  if linha.startswith("| ") and "⏳ pendente" in linha:
                      linhas_antigas.append(linha)

          todas_linhas = linhas_antigas + novas_linhas
          # Deduplicar por protocolo (2ª coluna)
          vistos = set()
          dedup = []
          for l in todas_linhas:
              proto = l.split("|")[2].strip() if "|" in l else ""
              if proto not in vistos:
                  vistos.add(proto)
                  dedup.append(l)

          conteudo_novo = cabecalho + "\n".join(dedup) + "\n\n"
          conteudo_novo += f"*Última atualização: {hoje}*\n"

          # ── Enviar para o GitHub ───────────────────────────────────────────
          payload = {
              "message": f"monitor: {len(novas_linhas)} pesquisa(s) nova(s) pendente(s) — {hoje}",
              "content": base64.b64encode(conteudo_novo.encode()).decode(),
              "branch": "main",
          }
          if sha:
              payload["sha"] = sha

          data = json.dumps(payload).encode()
          req  = urllib.request.Request(base_url, data=data, headers=headers, method="PUT")
          with urllib.request.urlopen(req) as resp:
              print(f"✅ pesquisas_pendentes.md atualizado no agregador ({resp.status})")

          PYEOF
