name: Monitor TSE

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 Brasília = 12:00 UTC
  workflow_dispatch:        # permite rodar manualmente

jobs:
  monitorar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas requests

      - name: Rodar monitor
        id: monitor
        run: |
          python scripts/monitor.py
          echo "tem_novas=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Gerar alerta.txt
        run: |
          TODAY=$(date +'%Y-%m-%d')
          JSON_FILE="data/novas_${TODAY}.json"

          python3 << PYEOF
          import json, os
          from datetime import date

          json_file = f"data/novas_{date.today()}.json"

          if not os.path.exists(json_file):
              txt = "Nenhuma pesquisa nova hoje."
          else:
              with open(json_file) as f:
                  dados = json.load(f)

              if dados["total"] == 0:
                  txt = f"[{dados['data']}] Nenhuma pesquisa nova hoje."
              else:
                  linhas = []
                  linhas.append("=" * 60)
                  linhas.append(f"MONITOR TSE — {dados['data']}")
                  linhas.append(f"{dados['total']} NOVA(S) PESQUISA(S) PRESIDENCIAL(IS)")
                  linhas.append("=" * 60)
                  linhas.append("")

                  for p in dados["novas"]:
                      linhas.append(f"INSTITUTO:   {p['instituto']}")
                      linhas.append(f"PROTOCOLO:   {p['protocolo']}")
                      linhas.append(f"CAMPO:       {p['campo_inicio']} até {p['campo_fim']}")
                      linhas.append(f"DIVULGAÇÃO:  {p['divulgacao']}")
                      n = p.get("amostra")
                      linhas.append(f"AMOSTRA:     {f'{n:,}'.replace(',', '.') if n else '—'} entrevistados")
                      linhas.append(f"METODOLOGIA: {p['metodologia']}")
                      linhas.append(f"INSTITUTO:   {'Reconhecido' if p.get('conhecido') else 'NOVO — verificar manualmente'}")
                      linhas.append("-" * 60)
                      linhas.append("")

                  linhas.append("Acesse o repositório para ver o relatório completo.")
                  txt = "\n".join(linhas)

          with open("alerta.txt", "w", encoding="utf-8") as f:
              f.write(txt)

          print(txt)
          PYEOF

      - name: Salvar resultados no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ relatorio_*.md alerta.txt
          git diff --cached --quiet || git commit -m "monitor: snapshot $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: Abrir Issue com novas pesquisas
        if: steps.monitor.outputs.tem_novas == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const hoje = new Date().toISOString().slice(0, 10);
            const path = `data/novas_${hoje}.json`;

            if (!fs.existsSync(path)) { console.log('JSON não encontrado.'); return; }

            const dados = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (dados.total === 0) { console.log('Nenhuma pesquisa nova.'); return; }

            let body = `## 🆕 ${dados.total} nova(s) pesquisa(s) presidencial(is) registrada(s) no TSE\n\n`;
            body += `**Data:** ${dados.data}\n\n`;

            for (const p of dados.novas) {
              body += `### ${p.instituto}\n`;
              body += `| Campo | Valor |\n|---|---|\n`;
              body += `| Protocolo | \`${p.protocolo}\` |\n`;
              body += `| Registro TSE | ${p.registro} |\n`;
              body += `| Campo | ${p.campo_inicio} → ${p.campo_fim} |\n`;
              body += `| Divulgação | ${p.divulgacao} |\n`;
              const n = p.amostra;
              body += `| Amostra | ${n ? n.toLocaleString('pt-BR') : '—'} entrevistados |\n`;
              body += `| Metodologia | ${p.metodologia} |\n`;
              body += `| Instituto | ${p.conhecido ? '✅ Reconhecido' : '⚠️ Novo — verificar manualmente'} |\n\n`;
            }

            body += `---\n*Gerado automaticamente pelo monitor TSE.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[TSE] ${dados.total} nova(s) pesquisa(s) — ${dados.data}`,
              body,
              labels: ['pesquisa-nova'],
            });
